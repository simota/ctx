<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" role="img" aria-label="ctx hanko seal">
  <title>ctx — hanko vermillion seal</title>
  <!-- outer square frame (heavy vermillion) -->
  <rect x="3.5" y="3.5" width="53" height="53" rx="2" ry="2"
        fill="none" stroke="#e07a3a" stroke-width="2.8"/>
  <!-- inner hair line (inset) -->
  <rect x="7.5" y="7.5" width="45" height="45" rx="1" ry="1"
        fill="none" stroke="#e07a3a" stroke-width="0.8"/>
  <!-- "ctx" horizontal, condensed serif italic (pressed-seal look) -->
  <text x="30" y="36"
        font-family="'Noto Serif JP', 'Iowan Old Style', Georgia, serif"
        font-size="20" font-weight="900" fill="#e07a3a"
        text-anchor="middle" dominant-baseline="middle"
        letter-spacing="-1.2"
        font-style="italic">ctx</text>
  <!-- signature stroke underline -->
  <line x1="16" y1="46" x2="44" y2="46" stroke="#e07a3a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
