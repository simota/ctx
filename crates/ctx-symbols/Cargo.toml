[package]
name = "ctx-symbols"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of internal/symbols pure-compute helpers (Tier 2 #5) — lookup post-processing + apionly text rendering. Tree-sitter extraction stays Go-side per scope-split."
license = "MIT"

[features]
default = []
testing = []
dhat = ["dep:dhat"]

[lib]
name = "ctx_symbols"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
once_cell = "1"
dhat = { version = "0.3", optional = true }

# Tree-sitter extraction. Versions pinned to the ABI-14 grammar snapshot
# that matches smacker/go-tree-sitter (the Go oracle). Grammars compile via
# the `cc` crate at build time (a build-time C dependency; the produced
# binary itself stays cgo-free — no Go linkage).
tree-sitter = "=0.22.6"
tree-sitter-go = "=0.21.2"
tree-sitter-javascript = "=0.21.4"
tree-sitter-python = "=0.21.0"
tree-sitter-typescript = "=0.21.2"
# Rust/Swift/Kotlin/Java extraction. These have no Go oracle counterpart (the
# Go extractor only covers go/ts/js/py), so they are not bound by byte-parity —
# but they MUST resolve onto the same tree-sitter 0.22.6 core as the pinned
# grammars above (one `tree_sitter::Parser`/`Language` ABI per binary). Pinned
# to the newest versions whose tree-sitter req still admits 0.22.6:
#   rust 0.21.2 (>=0.21.0), swift 0.5.0 (^0.22.5), kotlin 0.3.8 (>=0.21,<0.23),
#   java 0.21.0 (>=0.21.0).
tree-sitter-rust = "=0.21.2"
tree-sitter-swift = "=0.5.0"
tree-sitter-kotlin = "=0.3.8"
tree-sitter-java = "=0.21.0"

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["testing"]

[[test]]
name = "regression"
path = "tests/regression.rs"

[[test]]
name = "sticky_handle"
path = "tests/sticky_handle.rs"
required-features = ["testing"]

[[bench]]
name = "symbols"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat"]
