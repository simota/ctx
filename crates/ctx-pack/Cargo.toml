[package]
name = "ctx-pack"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of internal/pack pure-compute layer (relevance scoring sessioned + diff/redact/from_where/preset stateless) — Tier 2 #2 scope-split per Phase 4 brief"
license = "MIT"

[features]
default = []
testing = []
dhat = ["dep:dhat"]

[lib]
name = "ctx_pack"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"
libc = "0.2"
dhat = { version = "0.3", optional = true }
ctx-contract = { path = "../ctx-contract" }
ctx-tokens = { path = "../ctx-tokens" }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["testing"]

[[test]]
name = "regression"
path = "tests/regression.rs"

[[test]]
name = "sticky_handle"
path = "tests/sticky_handle.rs"

[[bench]]
name = "relevance"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat"]
