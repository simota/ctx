[package]
name = "ctx-digest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Repository activity digest (commits, churn, token/symbol deltas) shared by the ctx CLI and MCP server"
license = "MIT"

[lib]
name = "ctx_digest"
path = "src/lib.rs"

[dependencies]
ctx-pack = { path = "../ctx-pack" }
ctx-tokens = { path = "../ctx-tokens" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
