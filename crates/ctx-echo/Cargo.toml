[package]
name = "ctx-echo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of internal/echo/ — BM25 retrieval-based pack evaluator"
license = "MIT"

[features]
default = []
# Opt-in feature exposing testing helpers (parity_fixture_builder analogue)
# without running cargo test. Phase 4 integration tests enable this when
# they drive the helper as a library.
testing = []
# dhat memory profiling — see benches/memory.rs.
dhat-heap = ["dep:dhat"]

[lib]
name = "ctx_echo"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"
libc = "0.2"
dhat = { version = "0.3", optional = true }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "regression"
path = "tests/regression.rs"

[[bench]]
name = "echo"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat-heap"]
