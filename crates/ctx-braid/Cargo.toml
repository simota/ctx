[package]
name = "ctx-braid"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of internal/braid pure-compute layer (Allocate / Config Load+Validate / MergePaths / shellquote) — BATCH-style stateless API per Tier 2 #1 brief"
license = "MIT"

[features]
default = []
testing = []
dhat = ["dep:dhat"]

[lib]
name = "ctx_braid"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
libc = "0.2"
once_cell = "1"
dhat = { version = "0.3", optional = true }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["testing"]

[[test]]
name = "regression"
path = "tests/regression.rs"

[[bench]]
name = "braid"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat"]
