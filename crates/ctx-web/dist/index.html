<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ctx browse</title>
    <script>
      // FOUC guard: set data-theme before CSS evaluates.
      (function () {
        var valid = {
          dark: 1, light: 1,
          lofi: 1, sunrise: 1, ocean: 1, frost: 1,
          sumi: 1, moss: 1, newsprint: 1, sepia: 1, solarpunk: 1,
          crt: 1, synthwave: 1, blueprint: 1, forge: 1, ascii: 1,
          eink: 1,
        };
        try {
          var v = localStorage.getItem('ctx-viewer-theme');
          if (!valid[v]) {
            v = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.dataset.theme = v;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
