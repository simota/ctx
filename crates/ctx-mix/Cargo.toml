[package]
name = "ctx-mix"
version = "0.1.0"
edition = "2021"
publish = false
description = "Saved file-selection recipes (mixes) shared by the ctx CLI, web UI and MCP server"
license = "MIT"

[lib]
name = "ctx_mix"
path = "src/lib.rs"

[dependencies]
ctx-pack = { path = "../ctx-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"
