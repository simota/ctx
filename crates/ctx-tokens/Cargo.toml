[package]
name = "ctx-tokens"
version = "0.1.0"
edition = "2021"
publish = false
description = "Token counting with cl100k_base BPE — Rust port of internal/tokens"
license = "MIT"

[lib]
name = "ctx_tokens"
path = "src/lib.rs"

[dependencies]
regex-syntax = "0.8"

[build-dependencies]
# Decodes the vocabulary file into the static lookup table (build.rs).
base64 = "0.22"

[dev-dependencies]
# Oracles for the exactness tests: the upstream encoder (and its BPE merge,
# which takes an FxHashMap) and the exact cl100k_base split pattern as
# tiktoken-rs compiles it.
tiktoken-rs = "0.11"
fancy-regex = "0.17"
rustc-hash = "1"
