name: Assistant verification

on:
  push:
    branches:
      - fix/git-special-path-handling-2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format ctx-pack
        run: cargo fmt --manifest-path crates/ctx-pack/Cargo.toml -- --check
      - name: Format ctx-git
        run: cargo fmt --manifest-path crates/ctx-git/Cargo.toml -- --check
      - name: Format ctx-cli
        run: cargo fmt --manifest-path crates/ctx-cli/Cargo.toml -- --check
      - name: Test ctx-pack
        run: cargo test --manifest-path crates/ctx-pack/Cargo.toml
      - name: Test ctx-git
        run: cargo test --manifest-path crates/ctx-git/Cargo.toml
      - name: Test ctx-cli
        run: cargo test --manifest-path crates/ctx-cli/Cargo.toml
      - name: Clippy affected crates
        run: cargo clippy --manifest-path crates/ctx-cli/Cargo.toml --all-targets -- -D warnings
